/* ===== 设计令牌（来自 Stitch 原型 tailwind.config） ===== */
page {
  --primary: #630ed4;
  --primary-container: #7c3aed;
  --on-primary: #ffffff;
  --primary-fixed: #eaddff;
  --accent-purple-light: #ede9fe;
  --accent-purple-hover: #6d28d9;
  --accent-yellow: #fbbf24;
  --accent-coral: #f97316;
  --text-primary: #0f172a;
  --text-secondary: #64748b;
  --text-tertiary: #94a3b8;
  --surface-white: #ffffff;
  --surface-container: #e7eeff;
  --surface-container-high: #d8e3fb;
  --surface-container-low: #f0f3ff;
  --secondary: #00687a;
  --secondary-fixed: #acedff;
  --tertiary: #005b3d;
  --tertiary-container: #007650;
  --tertiary-fixed: #6ffbbe;
  --badge-locked-mask: #cbd5e1;
  --inverse-surface: #263143;
  --inverse-on-surface: #ecf1ff;
  --warning-bg: #fef3c7;
  --warning-text: #92400e;
  --card-border: rgba(255, 255, 255, 0.6);
  --bg-top: #e0f2fe;
  --bg-bottom: #dcfce7;

  background: linear-gradient(180deg, #e0f2fe 0%, #dcfce7 100%);
  
  font-family: "Plus Jakarta Sans", "PingFang SC", "Helvetica Neue", Roboto, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

view,
text,
image,
scroll-view {
  box-sizing: border-box;
}

/* ===== 布局工具 ===== */
.row {
  display: flex;
  align-items: center;
}
.col {
  display: flex;
  flex-direction: column;
}
.between {
  justify-content: space-between;
}
.center {
  justify-content: center;
  align-items: center;
}
.flex1 {
  flex: 1;
  min-width: 0;
}
.truncate {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* ===== 字号体系（1 设计 px = 0.96px） ===== */
.t-hero {
  font-size: 30.50px;
  line-height: 38.50px;
  font-weight: 700;
  letter-spacing: -0.25px;
}
.t-24 {
  font-size: 23.00px;
  line-height: 30.50px;
  font-weight: 700;
  letter-spacing: -0.20px;
}
.t-20 {
  font-size: 19.00px;
  line-height: 27.00px;
  font-weight: 600;
}
.t-18 {
  font-size: 17.50px;
  line-height: 23.00px;
  font-weight: 600;
}
.t-16 {
  font-size: 15.50px;
  line-height: 23.00px;
  font-weight: 500;
}
.t-14 {
  font-size: 13.50px;
  line-height: 19.00px;
}
.t-13 {
  font-size: 12.50px;
  line-height: 17.50px;
}
.t-12 {
  font-size: 11.50px;
  line-height: 15.50px;
  font-weight: 600;
}
.t-11 {
  font-size: 10.50px;
  line-height: 13.50px;
  font-weight: 500;
}
.t-10 {
  font-size: 9.50px;
  line-height: 13.50px;
  font-weight: 500;
}
.bold {
  font-weight: 700;
}
.semi {
  font-weight: 600;
}
.c-primary {
  color: var(--primary);
}
.c-pc {
  color: var(--primary-container);
}
.c-s {
  color: var(--text-secondary);
}
.c-t {
  color: var(--text-tertiary);
}

/* ===== 通用卡片 ===== */
.card {
  background: var(--surface-white);
  border-radius: 15.50px;
}
.shadow-soft {
  box-shadow: 0 4.00px 15.50px -2.00px rgba(124, 58, 237, 0.06), 0 2.00px 6.00px 0 rgba(15, 23, 42, 0.03);
}
.shadow-card {
  box-shadow: 0 7.50px 23.00px -4.00px rgba(124, 58, 237, 0.12), 0 2.00px 7.50px rgba(15, 23, 42, 0.04);
}
.hairline {
  height: 1px;
  background: rgba(204, 195, 216, 0.6);
}

/* ===== 动画 ===== */
@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.45;
  }
}
@keyframes wave {
  0%,
  60%,
  100% {
    transform: rotate(0deg);
  }
  10%,
  30% {
    transform: rotate(14deg);
  }
  20%,
  40% {
    transform: rotate(-8deg);
  }
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes ping {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }
  70%,
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}
@keyframes bounceY {
  0%,
  100% {
    transform: scaleY(0.55);
  }
  50% {
    transform: scaleY(1);
  }
}
@keyframes floaty {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-4.00px);
  }
