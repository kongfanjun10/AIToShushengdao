/* ===== 设计令牌（来自 Stitch 原型 tailwind.config） ===== */
page {
  --primary: #0369a1;
  --primary-container: #0ea5e9;
  --on-primary: #ffffff;
  --primary-fixed: #eaddff;
  --accent-purple-light: #e0f2fe;
  --accent-purple-hover: #0369a1;
  --accent-yellow: #fbbf24;
  --accent-coral: #f97316;
  --text-primary: #0f172a;
  --text-secondary: #64748b;
  --text-tertiary: #94a3b8;
  --surface-white: #ffffff;
  --surface-container: #e7eeff;
  --surface-container-high: #d8e3fb;
  --surface-container-low: #f0f3ff;
  --secondary: #00687a;
  --secondary-fixed: #acedff;
  --tertiary: #005b3d;
  --tertiary-container: #007650;
  --tertiary-fixed: #6ffbbe;
  --badge-locked-mask: #cbd5e1;
  --inverse-surface: #263143;
  --inverse-on-surface: #ecf1ff;
  --warning-bg: #fef3c7;
  --warning-text: #92400e;
  --card-border: rgba(255, 255, 255, 0.6);
  --bg-top: #e0f2fe;
  --bg-bottom: #dcfce7;

  background: linear-gradient(180deg, #e0f2fe 0%, #dcfce7 100%);
  
  font-family: "Plus Jakarta Sans", "PingFang SC", "Helvetica Neue", Roboto, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

view,
text,
image,
scroll-view {
  box-sizing: border-box;
}

/* ===== 顶部栏（全局）=====
 * 不透明底：页面往上滑时内容不会从标题后面透出来；
 * 滚动超过 8px 加一条投影，层次更清楚（各页 onPageScroll 里切 hd-solid）。 */
.hd {
  background: #f2f9ff;
}
.hd.hd-solid {
  background: #f2f9ff;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.06), 0 4.00px 11.00px rgba(15, 23, 42, 0.05);
}

/* ===== 布局工具 ===== */
.row {
  display: flex;
  align-items: center;
}.col {
  display: flex;
  flex-direction: column;
}
.between {
  justify-content: space-between;
}
.center {
  justify-content: center;
  align-items: center;
}
.flex1 {
  flex: 1;
  min-width: 0;
}
.truncate {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* ===== 字号体系（1 设计 px = 0.96px） ===== */
.t-hero {
  font-size: 30.50px;
  line-height: 38.50px;
  font-weight: 700;
  letter-spacing: -0.25px;
}
